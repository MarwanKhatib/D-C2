name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -quiet \
            -exclude=G104,G204,G304,G702,G706 ./...

  release:
    needs: security
    runs-on: ubuntu-latest
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test -race -count=1 ./...

      - name: build artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}" \
          COMMIT="${GITHUB_SHA}" \
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          ./scripts/build.sh all

      - name: generate SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -licenses -json -output dist/sbom.cdx.json .

      - name: sign Windows binary (optional)
        if: ${{ env.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          printf '%s' "$WINDOWS_SIGNING_PFX_BASE64" | base64 -d > /tmp/sign.pfx
          osslsigncode sign -pkcs12 /tmp/sign.pfx -pass "$WINDOWS_SIGNING_PFX_PASSWORD" \
            -n "D-C2" -i "https://github.com/MarwanKhatib/D-C2" \
            -in dist/dc2-windows-amd64.exe -out dist/dc2-windows-amd64-signed.exe
          mv dist/dc2-windows-amd64-signed.exe dist/dc2-windows-amd64.exe
          rm -f /tmp/sign.pfx

      - name: checksums
        run: |
          cd dist
          sha256sum dc2-* sbom.cdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
